name: Order Service CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-2
  ECR_REPOSITORY: order-service
  GITOPS_REPOSITORY: Sbajman/idp-platform

jobs:
  test:
    name: Test

    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: |
          PYTHONPATH=. python -m pytest -v


  build-and-push:
    name: Build, Push and Promote

    runs-on: ubuntu-latest

    needs: test

    # Only promote images from main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::426294745420:role/order-service-github-ci
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build \
            -t $ECR_REPOSITORY:${{ github.sha }} \
            .

      - name: Tag Docker image
        run: |
          docker tag \
            $ECR_REPOSITORY:${{ github.sha }} \
            ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:${{ github.sha }}

      - name: Push Docker image to ECR
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:${{ github.sha }}

      - name: Print image reference
        run: |
          echo "Image pushed:"
          echo "${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:${{ github.sha }}"

      # ---------------------------------------------------------
      # GitOps promotion
      # ---------------------------------------------------------

      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPOSITORY }}
          token: ${{ secrets.GITOPS_REPO_TOKEN }}
          path: idp-platform
          ref: main

      - name: Update service image
        working-directory: idp-platform
        env:
          IMAGE_TAG: ${{ github.sha }}
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import yaml

          path = Path("service-definitions/order-service/service.yaml")

          with path.open() as f:
              data = yaml.safe_load(f)

          data["spec"]["image"]["repository"] = (
              f"{os.environ['ECR_REGISTRY']}/order-service"
          )

          data["spec"]["image"]["tag"] = os.environ["IMAGE_TAG"]

          with path.open("w") as f:
              yaml.safe_dump(
                  data,
                  f,
                  sort_keys=False,
                  default_flow_style=False
              )
          PY

      - name: Setup Python for platform generator
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install generator dependencies
        working-directory: idp-platform
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            pyyaml \
            jsonschema \
            jinja2

      - name: Generate GitOps configuration
        working-directory: idp-platform
        run: |
          python3 platform-generator/scripts/generate_service.py \
            service-definitions/order-service/service.yaml \
            platform-gitops/applications

      - name: Show GitOps changes
        working-directory: idp-platform
        run: |
          git status
          git diff -- \
            service-definitions/order-service/service.yaml \
            platform-gitops/applications/order-service

      - name: Commit and push GitOps change
        working-directory: idp-platform
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            service-definitions/order-service/service.yaml \
            platform-gitops/applications/order-service

          if git diff --cached --quiet; then
            echo "No GitOps changes detected."
            exit 0
          fi

          git commit \
            -m "chore(order-service): promote image ${IMAGE_TAG}"

          git push origin main
